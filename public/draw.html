<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>作画 · 你画AI猜</title>
  <link rel="stylesheet" href="/draw.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand">你画AI猜 <small id="status">连接中…</small></div>
    <div class="brushctl">
      <span>笔刷</span>
      <input id="brushSlider" type="range" min="1" max="8" step="0.5" value="2">
      <span id="brushVal">2</span>
      <button id="brushMinus" type="button" aria-label="笔刷细一点">−</button>
      <button id="brushPlus" type="button" aria-label="笔刷粗一点">＋</button>
    </div>
    <div class="actions">
      <button id="clear" type="button">清空</button>
      <button id="finish" type="button">结束本轮</button>
    </div>
  </header>

  <div id="stage"><canvas id="c" width="1600" height="900"></canvas></div>

  <div id="prompt">
    <div class="prompt-label">请画</div>
    <div id="word">等待开始</div>
    <div id="hint"></div>
    <div id="timer">--</div>
  </div>

  <div id="lockBanner">AI 已锁定猜测，等待结算…</div>

  <div id="judgingOverlay">
    <h2>等待主持人裁定</h2>
    <p>AI 没认出来。主持人将判断这幅画是否足够像题目——<br>画得像算 AI 翻车，画得太抽象则无人得分。</p>
  </div>

  <div id="result">
    <div id="resultTitle"></div>
    <div id="resultDetail"></div>
  </div>

  <div id="fallback">
    <video id="fallbackVideo" src="/assets/fallback.mp4" muted loop playsinline></video>
    <div class="fallback-text">
      <h2>模型加载失败</h2>
      <p>正在播放预设录屏，请主持人按人工裁判规则判定本轮。</p>
      <p class="small">录屏文件：assets/fallback.mp4（如未放置则只显示本提示）</p>
    </div>
  </div>
</div>
<script src="/draw.js"></script>
</body>
</html>
