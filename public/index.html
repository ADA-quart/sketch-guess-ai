<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>你画AI猜 · 本地离线控制台</title>
  <style>
    body{margin:0;background:#f5f7fb;color:#1b2340;font-family:"Microsoft YaHei",system-ui,sans-serif}
    main{max-width:880px;margin:60px auto;padding:0 24px}
    h1{font-size:34px;margin:0 0 8px}
    p.lead{color:#5c6784;margin:0 0 36px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
    a.card{display:block;background:#fff;border:1px solid #e0e6f0;border-radius:16px;padding:24px;text-decoration:none;color:inherit;box-shadow:0 6px 20px rgba(30,50,100,.05)}
    a.card:hover{border-color:#5b7cfa;transform:translateY(-2px)}
    a.card h2{margin:0 0 8px;font-size:20px;color:#3454d1}
    a.card span{color:#66708c;font-size:14px}
    code{background:#eef1f8;padding:2px 6px;border-radius:4px}
    footer{margin-top:36px;color:#8b94ad;font-size:13px}
  </style>
</head>
<body>
<main>
  <h1>你画AI猜 · 本地离线版</h1>
  <p class="lead">选择一个入口。所有页面都必须在同一局域网内访问本机地址。</p>
  <div class="grid">
    <a class="card" href="/draw"><h2>平板作画 /draw</h2><span>粗笔刷、触摸防滚动、400ms 压缩上传、断线自动重连</span></a>
    <a class="card" href="/display"><h2>大屏展示 /display</h2><span>Top-5 中文类别、动态置信度条、翻转与锁定特效</span></a>
    <a class="card" href="/host"><h2>主持控制 /host</h2><span>开始、锁定、重置、指定词、骗AI模式状态</span></a>
    <a class="card" href="/api/status"><h2>运行状态 /api/status</h2><span>查看实际推理路线、帧丢弃统计、内存占用</span></a>
  </div>
  <footer>不落盘 · 不上传 · 画布帧只在局域网 WebSocket 内传输</footer>
</main>
</body>
</html>
